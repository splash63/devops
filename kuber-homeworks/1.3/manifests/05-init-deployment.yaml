apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-wait
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-wait
  template:
    metadata:
      labels:
        app: nginx-wait
    spec:
      initContainers:
        - name: wait-for-service
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nslookup nginx-wait.default.svc.cluster.local; do
                echo "Waiting for nginx-wait Service DNS"
                sleep 2
              done
              echo "Service DNS is ready"
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
