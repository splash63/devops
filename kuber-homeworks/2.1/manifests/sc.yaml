apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: data-exchange-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-exchange-sc-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "data-exchange-local"
  local:
    path: /var/lib/data-exchange-lab/sc
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - admin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-exchange-sc-pvc
spec:
  storageClassName: "data-exchange-local"
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
    spec:
      containers:
        - name: busybox
          image: busybox:1.37
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                date -u '+%Y-%m-%dT%H:%M:%SZ' >> /shared/exchange.log
                sleep 5
              done
          volumeMounts:
            - name: shared
              mountPath: /shared
        - name: multitool
          image: wbitt/network-multitool:latest
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: data-exchange-sc-pvc
